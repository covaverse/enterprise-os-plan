<!doctype html>
<!-- แม่แบบของ viewer — แก้ที่ไฟล์นี้ แล้วรัน python viewer/build.py (อย่าแก้ index.html ตรงๆ) -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 4 Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d8dee4;
  --accent: #2563eb; --accent-soft: #dbeafe; --ok: #16a34a; --ok-soft: #dcfce7;
  --code: #f2f4f7; --mark: #fde68a; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a21; --fg: #e6e8eb; --muted: #9aa4af; --border: #2b313b;
    --accent: #7aa7ff; --accent-soft: #1e2a44; --ok: #4ade80; --ok-soft: #14301f;
    --code: #1e232c; --mark: #5c4a12; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.7 "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  display: grid; grid-template-columns: 300px minmax(0, 1fr) 240px; overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* แถบซ้าย */
#side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#side header { padding: 14px 16px 8px; font-weight: 700; font-size: 16px; }
#side header small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
#q { margin: 4px 12px 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
#nav, #results { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
#nav details { margin: 2px 0; }
#nav summary { cursor: pointer; padding: 6px 8px; font-weight: 600; color: var(--muted); font-size: 13px; list-style: none; }
#nav summary::before { content: "▸ "; }
#nav details[open] summary::before { content: "▾ "; }
#nav a, #results a { display: block; padding: 5px 10px 5px 18px; border-radius: 6px; color: var(--fg); font-size: 13.5px; line-height: 1.45; }
#nav a.top { padding-left: 10px; font-weight: 600; }
#nav a:hover, #results a:hover { background: var(--accent-soft); text-decoration: none; }
#nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#results a { padding-left: 10px; }
#results .snip { display: block; color: var(--muted); font-size: 12.5px; }
#results mark { background: var(--mark); color: inherit; }
#results .none { padding: 10px; color: var(--muted); }

/* เนื้อหา */
#main { overflow-y: auto; min-height: 0; }
#content { max-width: 960px; margin: 0 auto; padding: 24px 32px 80px; }
#toc { border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 12px; font-size: 13px; }
#toc b { display: block; color: var(--muted); margin-bottom: 6px; }
#toc a { display: block; color: var(--muted); padding: 3px 0; line-height: 1.4; }
#toc a.h3 { padding-left: 12px; }
#toc a:hover { color: var(--accent); }
#topbar { display: none; }

.md h1 { font-size: 26px; line-height: 1.35; }
.md h2 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 36px; }
.md h3 { font-size: 17px; margin-top: 26px; }
.md h1, .md h2, .md h3, .md h4 { scroll-margin-top: 16px; }
.md blockquote { margin: 12px 0; padding: 6px 14px; border-left: 4px solid var(--accent); background: var(--panel); color: var(--muted); border-radius: 0 6px 6px 0; }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md pre.mermaid { background: var(--panel); border: 1px solid var(--border); text-align: center; }
.md pre.mermaid svg { max-width: 100%; height: auto; }
.md pre.mermaid { cursor: zoom-in; }
.md pre.mermaid.big { cursor: zoom-out; text-align: left; }
.table-wrap { overflow-x: auto; margin: 12px 0; }
.md table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; }
.md th { background: var(--panel); text-align: left; }
.md tr:nth-child(even) td { background: color-mix(in srgb, var(--panel) 60%, transparent); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark); } to { background: transparent; } }

/* Roadmap */
.rm .lead { color: var(--muted); margin-top: -6px; }
.bar { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.overall { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 16px 0; box-shadow: var(--shadow); }
.overall .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.overall b { font-size: 20px; }
.ms { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 12px 0 20px; }
.ms label { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 13px; line-height: 1.5; }
.ms label.done { border-color: var(--ok); background: var(--ok-soft); }
.ms .name { font-weight: 700; font-size: 15px; }
.ms .muted { color: var(--muted); }
details.grp { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; box-shadow: var(--shadow); }
details.grp > summary { cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; list-style: none; }
details.grp > summary .t { font-weight: 700; }
details.grp > summary .t::before { content: "▸ "; color: var(--muted); }
details.grp[open] > summary .t::before { content: "▾ "; }
details.grp > summary .n { color: var(--muted); font-size: 13px; }
details.grp > summary .bar { grid-column: 1 / -1; height: 6px; }
.steps { list-style: none; margin: 0; padding: 0 16px 12px; }
.steps .steps { padding: 4px 0 0 28px; }
.step { border-top: 1px solid var(--border); padding: 10px 0; }
.steps .steps .step { border-top: 1px dashed var(--border); padding: 6px 0; font-size: 14px; }
.step > label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.step input { margin-top: 5px; width: 17px; height: 17px; flex: none; accent-color: var(--ok); }
.step.done > label .lbl { color: var(--muted); text-decoration: line-through; }
.badge { display: inline-block; max-width: 100%; font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 0 8px; margin-right: 6px; overflow-wrap: anywhere; }
.step .lbl { min-width: 0; overflow-wrap: anywhere; }
.days { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
.detail { margin: 4px 0 0 27px; color: var(--muted); font-size: 13.5px; }
.detail div { margin: 2px 0; }
.detail b { color: var(--fg); font-weight: 600; }
.more { margin-left: 27px; font-size: 13px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }

@media (max-width: 1150px) { body { grid-template-columns: 280px minmax(0, 1fr); } #toc { display: none; } }
@media (max-width: 760px) {
  body { display: block; overflow: auto; }
  #topbar { display: flex; position: sticky; top: 0; z-index: 5; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-weight: 700; }
  #side { position: fixed; inset: 0 25% 0 0; z-index: 10; transform: translateX(-105%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.3); }
  body.menu #side { transform: none; }
  #main { overflow: visible; }
  #content { padding: 16px 16px 60px; }
  .md h1 { font-size: 22px; }
  .detail, .more { margin-left: 0; }
}
/* หน้าล็อก (ฉบับเผยแพร่ที่เข้ารหัส) */
#lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); padding: 16px; }
#lock[hidden] { display: none; }
#lock form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
#lock h2 { margin: 0 0 6px; font-size: 19px; }
#lock p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
#lock input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
#lock .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
#lock button { background: var(--accent); color: #fff; border: 0; padding: 9px 18px; font-weight: 600; }
#lock .err { color: #dc2626; min-height: 20px; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="lock" hidden>
  <form id="lockform">
    <h2>🔒 แผนงานส่วนตัว</h2>
    <p>ใส่รหัสผ่านเพื่อเปิดอ่าน · เนื้อหาถูกเข้ารหัสไว้ ถอดได้ในเครื่องนี้เท่านั้น</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
    <div class="row"><label><input id="remember" type="checkbox"> จำไว้บนเครื่องนี้</label><button type="submit">เปิด</button></div>
    <div class="err" id="lockerr"></div>
  </form>
</div>
<aside id="side">
  <header><span id="name"></span><small id="built"></small></header>
  <input id="q" type="search" placeholder="ค้นหาในทุกไฟล์…" autocomplete="off">
  <nav id="nav"></nav>
  <div id="results" hidden></div>
</aside>
<main id="main">
  <div id="topbar"><button id="menu" aria-label="เปิดเมนู">☰</button><span id="name2"></span></div>
  <div id="content"></div>
</main>
<aside id="toc"></aside>

const KEYSTORE = "itai-p4-key";
const STORE = "itai-p4-progress-v1";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let byPath = {};
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{M}\p{N} _-]/gu, "").replace(/ /g, "-");
const href = (path, anchor) => "#" + encodeURIComponent(path) + (anchor ? "@" + encodeURIComponent(anchor) : "");
const inline = s => marked.parseInline(String(s));
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { done = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(done)); } catch { /* ใช้ต่อได้ แค่ไม่จำ */ } };
let current = null;

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: dark ? "dark" : "default" });
marked.use({
  renderer: {
    heading(text, level, raw) { return `<h${level} id="${esc(slug(raw))}">${text}</h${level}>`; },
    code(code, lang) {
      if ((lang || "").trim() === "mermaid") return `<pre class="mermaid" title="คลิกเพื่อขยาย / ย่อ">${esc(code)}</pre>`;
      return `<pre><code>${esc(code)}</code></pre>`;
    },
  },
});

/* ---------- แถบซ้าย ---------- */
function buildNav() {
  const groups = {};
  for (const d of DATA.docs) if (!DATA.hidden.includes(d.group)) (groups[d.group] ||= []).push(d);
  $("#nav").innerHTML = `<a class="top" data-app href="#roadmap" data-path="roadmap">🗺️ Roadmap งาน 4</a>` +
    Object.entries(groups).map(([g, ds]) => `<details open><summary>${esc(g)}</summary>` +
      ds.map(d => `<a data-app href="${href(d.path)}" data-path="${esc(d.path)}" title="${esc(d.title)}">${esc(d.title)}</a>`).join("") +
      `</details>`).join("");
  const n = DATA.docs.filter(d => !DATA.hidden.includes(d.group)).length;
  $("#name").textContent = "🏢 " + DATA.name; $("#name2").textContent = DATA.name;
  $("#built").textContent = `${n} ไฟล์ · build ${DATA.built}`;
}
function markActive(path) {
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.path === path));
}

/* ---------- เปิดเอกสาร ---------- */
async function renderDoc(path, anchor) {
  const d = byPath[path];
  if (!d) { $("#content").innerHTML = `<p>ไม่พบไฟล์ ${esc(path)}</p>`; return; }
  if (current !== path) {
    current = path;
    const c = $("#content");
    const note = DATA.hidden.includes(d.group) ? `<blockquote>📎 ไฟล์นี้อยู่นอกงาน 4 — เปิดจากลิงก์เพื่ออ้างอิงเท่านั้น</blockquote>` : "";
    c.innerHTML = `<article class="md" data-base="${esc(path)}">${note}${marked.parse(d.md)}</article>`;
    c.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.before(w); w.append(t); });
    const hs = [...c.querySelectorAll("h2, h3")];
    $("#toc").innerHTML = "<b>ในไฟล์นี้</b>" + hs.map(h => `<a data-app class="${h.tagName.toLowerCase()}" href="${href(path, h.id)}">${esc(h.textContent)}</a>`).join("");
    document.title = d.title.replace(/^[^\p{L}\p{N}]+/u, "") + " · " + DATA.name;
    markActive(path);
    goAnchor(anchor);
    try { await mermaid.run({ nodes: c.querySelectorAll("pre.mermaid") }); } catch (err) { console.warn(err); }
  }
  goAnchor(anchor);
}
function goAnchor(anchor) {
  const main = $("#main");
  if (!anchor) { main.scrollTop = 0; window.scrollTo(0, 0); return; }
  const el = document.getElementById(anchor);
  if (!el) return;
  el.scrollIntoView({ block: "start" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ---------- Roadmap ---------- */
const allSteps = () => DATA.roadmap.groups.flatMap(g => g.steps.flatMap(s => [s, ...(s.children || [])]));
const count = steps => [steps.filter(s => done[s.id]).length, steps.length];
const pct = ([a, b]) => b ? Math.round(a * 100 / b) : 0;

function stepHtml(s) {
  const kids = s.children?.length ? `<ul class="steps">${s.children.map(stepHtml).join("")}</ul>` : "";
  const detail = s.detail.length ? `<div class="detail">${s.detail.map(([h, v]) => `<div><b>${esc(h)}:</b> ${inline(v)}</div>`).join("")}</div>` : "";
  return `<li class="step ${done[s.id] ? "done" : ""}" data-base="${esc(s.src)}">
    <label><input type="checkbox" data-id="${s.id}" ${done[s.id] ? "checked" : ""}>
      <span class="lbl">${s.badge ? `<span class="badge">${inline(s.badge)}</span>` : ""}${inline(s.label)}${s.days ? `<span class="days">${esc(s.days)}</span>` : ""}</span></label>
    ${detail}<a data-app class="more" href="${href(s.src, s.anchor)}">อ่านรายละเอียด →</a>${kids}</li>`;
}

function renderRoadmap() {
  current = "roadmap";
  const R = DATA.roadmap;
  const firstOpen = R.groups.findIndex(g => { const [a, b] = count(g.steps.flatMap(s => [s, ...(s.children || [])])); return a < b; });
  $("#content").innerHTML = `<section class="rm md">
    <h1>${esc(DATA.title)}</h1>
    <p class="lead">${esc(DATA.lead)}</p>
    <div class="overall"><div class="row"><span>ความคืบหน้ารวม</span><b id="ovp"></b></div><div class="bar"><i id="ovb"></i></div></div>
    <h2>Milestone</h2>
    <div class="ms" data-base="${esc(R.milestones[0].src)}">${R.milestones.map(m => `
      <label class="${done[m.id] ? "done" : ""}"><input type="checkbox" data-id="${m.id}" ${done[m.id] ? "checked" : ""}>
        <span class="name">${esc(m.badge)}</span> <span class="muted">· ${esc(m.label_head)} ${esc(m.label)}</span>
        ${m.detail.map(([h, v]) => `<div><span class="muted">${esc(h)}:</span> ${inline(v)}</div>`).join("")}</label>`).join("")}</div>
    <h2>ภาพรวมลำดับการพัฒนา</h2>
    <pre class="mermaid" title="คลิกเพื่อขยาย / ย่อ">${esc(R.gantt)}</pre>
    <p><a data-app href="${href(...R.gantt_src)}">เปิดแผนฉบับเต็ม (04k) →</a></p>
    <h2>ขั้นตอนแต่ละ Phase</h2>
    ${R.groups.map((g, i) => `<details class="grp" data-g="${i}" ${i === firstOpen ? "open" : ""}>
      <summary><span class="t">${esc(g.name)}</span><span class="n"></span><div class="bar"><i></i></div></summary>
      <ul class="steps">${g.steps.map(stepHtml).join("")}</ul></details>`).join("")}
    <div class="tools"><button id="openall">เปิดทุกกลุ่ม</button><button id="closeall">ปิดทุกกลุ่ม</button><button id="reset">ล้างความคืบหน้า</button></div>
  </section>`;
  $("#toc").innerHTML = "<b>กลุ่มงาน</b>" + R.groups.map((g, i) => `<a data-app href="#roadmap" data-jump="${i}">${esc(g.name)}</a>`).join("");
  document.title = "Roadmap · " + DATA.name;
  markActive("roadmap");
  updateCounts();
  $("#main").scrollTop = 0;
  mermaid.run({ nodes: $("#content").querySelectorAll("pre.mermaid") }).catch(err => console.warn(err));
}

function updateCounts() {
  const all = count(allSteps());
  $("#ovp").textContent = `${all[0]} / ${all[1]} ขั้น · ${pct(all)}%`;
  $("#ovb").style.width = pct(all) + "%";
  document.querySelectorAll("details.grp").forEach(el => {
    const g = DATA.roadmap.groups[el.dataset.g];
    const c = count(g.steps.flatMap(s => [s, ...(s.children || [])]));
    $(".n", el).textContent = `${c[0]}/${c[1]}`;
    $(".bar > i", el).style.width = pct(c) + "%";
  });
}

/* ---------- ค้นหา ---------- */
function search(q) {
  const box = $("#results");
  if (q.length < 2) { box.hidden = true; $("#nav").hidden = false; return; }
  const ql = q.toLowerCase(), out = [];
  for (const d of DATA.docs) {
    if (DATA.hidden.includes(d.group)) continue;
    let anchor = "", fence = false, hits = 0;
    for (const line of d.md.split("\n")) {
      if (line.startsWith("```")) { fence = !fence; continue; }
      const m = !fence && line.match(/^#{1,6}\s+(.*)/);
      if (m) anchor = slug(m[1]);
      if (line.toLowerCase().includes(ql)) {
        const i = line.toLowerCase().indexOf(ql);
        const snip = line.slice(Math.max(0, i - 40), i + q.length + 60).replace(/[|*`#>]/g, " ");
        out.push({ d, anchor, snip });
        if (++hits >= 3 || out.length >= 60) break;
      }
    }
    if (out.length >= 60) break;
  }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  box.innerHTML = out.length ? `<div class="none">พบ ${out.length}${out.length >= 60 ? "+" : ""} จุด</div>` + out.map(r =>
    `<a data-app href="${href(r.d.path, r.anchor)}">${esc(r.d.title)}<span class="snip">${esc(r.snip).replace(re, m => `<mark>${m}</mark>`)}</span></a>`).join("")
    : `<div class="none">ไม่พบ "${esc(q)}"</div>`;
  box.hidden = false; $("#nav").hidden = true;
}

/* ---------- เส้นทาง + คลิก ---------- */
function route() {
  let h = location.hash.slice(1);
  if (!h || h === "roadmap") return renderRoadmap();
  const at = h.indexOf("@");
  let path = at < 0 ? h : h.slice(0, at), anchor = at < 0 ? "" : h.slice(at + 1);
  try { path = decodeURIComponent(path); anchor = decodeURIComponent(anchor); } catch { /* ใช้ค่าดิบ */ }
  renderDoc(path, anchor);
  document.body.classList.remove("menu");
}
function resolve(base, rel) {
  const parts = base.split("/"); parts.pop();
  for (const seg of rel.split("/")) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}
document.addEventListener("click", e => {
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    e.preventDefault();
    const el = document.querySelector(`details.grp[data-g="${jump.dataset.jump}"]`);
    el.open = true; el.scrollIntoView({ block: "start" });
    return;
  }
  const a = e.target.closest("a[href]");
  if (!a) return;
  const link = a.getAttribute("href");
  if (/^(https?:|mailto:)/.test(link)) { a.target = "_blank"; a.rel = "noopener"; return; }
  const base = a.closest("[data-base]")?.dataset.base;
  if (a.hasAttribute("data-app") || !base) return;                    // ลิงก์ของ viewer เอง
  e.preventDefault();
  let [file, anchor = ""] = link.split("#");
  try { file = decodeURIComponent(file); anchor = decodeURIComponent(anchor); } catch { /* ใช้ค่าดิบ */ }
  const target = file ? resolve(base, file) : base;
  if (byPath[target]) {
    const h = href(target, anchor);
    if (location.hash === h) goAnchor(anchor); else location.hash = h;
  } else {
    window.open("../" + target, "_blank");                           // ไฟล์อื่นที่ไม่ใช่ MD
  }
});
document.addEventListener("change", e => {
  const id = e.target.dataset?.id;
  if (!id) return;
  done[id] = e.target.checked;
  if (!done[id]) delete done[id];
  save();
  (e.target.closest(".step") || e.target.closest("label")).classList.toggle("done", e.target.checked);
  updateCounts();
});
document.addEventListener("click", e => {
  if (e.target.id === "reset" && confirm("ล้างความคืบหน้าทั้งหมด?")) { done = {}; save(); renderRoadmap(); }
  if (e.target.id === "openall" || e.target.id === "closeall")
    document.querySelectorAll("details.grp").forEach(d => d.open = e.target.id === "openall");
  if (e.target.id === "menu") document.body.classList.toggle("menu");
});
document.addEventListener("click", e => {                        // คลิก diagram = ขยาย 1.5 เท่า (เลื่อนดูได้) / ย่อกลับ
  const pre = e.target.closest("pre.mermaid"), svg = pre?.querySelector("svg");
  if (!svg || e.target.closest("a")) return;
  const big = pre.classList.toggle("big");
  svg.style.maxWidth = big ? "none" : "";
  svg.style.width = big ? svg.viewBox.baseVal.width * 1.5 + "px" : "";
});
let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value.trim()), 150); });

function start(data) {
  DATA = data;
  byPath = Object.fromEntries(DATA.docs.map(d => [d.path, d]));
  $("#lock").hidden = true;
  window.addEventListener("hashchange", route);
  buildNav();
  route();
}

/* ---------- ฉบับเข้ารหัส ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openWith(raw, remember) {          // raw = กุญแจ AES 32 ไบต์
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.data));   // รหัสผิด = throw
  const json = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  if (remember) try { localStorage.setItem(KEYSTORE, btoa(String.fromCharCode(...raw))); } catch { /* ไม่จำก็ได้ */ }
  start(JSON.parse(json));
}
async function unlock(pass, remember) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(ENC.salt), iterations: ENC.iter }, base, 256);
  await openWith(new Uint8Array(bits), remember);
}
$("#lockform").addEventListener("submit", async e => {
  e.preventDefault();
  $("#lockerr").textContent = "กำลังถอดรหัส…";
  try { await unlock($("#pw").value, $("#remember").checked); }
  catch { $("#lockerr").textContent = "รหัสผ่านไม่ถูกต้อง"; $("#pw").select(); }
});

if (DATA) start(DATA);
else if (ENC) {
  let saved = null;
  try { saved = localStorage.getItem(KEYSTORE); } catch { /* ไม่มีที่เก็บ */ }
  const showLock = () => { $("#lock").hidden = false; $("#pw").focus(); };
  if (saved) openWith(b64(saved), false).catch(() => { try { localStorage.removeItem(KEYSTORE); } catch {} showLock(); });
  else showLock();
}
</script>
